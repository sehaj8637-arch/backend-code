<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Signup</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .card{max-width:520px;margin:40px auto;background:white;padding:24px;border-radius:10px;box-shadow:0 12px 40px rgba(2,6,23,0.06)}
    label{display:block;margin-bottom:6px;font-weight:600}
    .field{margin-bottom:12px}
    input{width:100%;padding:10px;border:1px solid #e6eef8;border-radius:8px}
    .button{background:#0066ff;color:#fff;padding:10px 14px;border-radius:8px;border:none;cursor:pointer}
  </style>
</head>
<body style="background:#f6f9ff;font-family:Arial,Helvetica,sans-serif;padding:24px">
  <div class="card">
    <h2>Create account</h2>
    <form method="POST" action="/signup">
      <div class="field">
        <label for="name">Name</label>
        <input id="name" name="name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required>
      </div>
      <div class="field">
        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="tel">
      </div>
      <div style="text-align:right">
        <button class="button" type="submit">Create Account</button>
      </div>
    </form>
  </div>
</body>
</html>
